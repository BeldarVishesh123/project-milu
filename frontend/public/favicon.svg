<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C261F"/>
      <stop offset="100%" stop-color="#18140F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4EEE1"/>
      <stop offset="50%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#B9892E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Dark Circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="#B9892E" stroke-width="14"/>
  
  <!-- Inner Gold Ring Accent -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#D4AF37" stroke-width="4" opacity="0.6"/>
  
  <!-- Central Kc Brand Emblem -->
  <text x="256" y="325" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="230" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">Kc</text>
</svg>